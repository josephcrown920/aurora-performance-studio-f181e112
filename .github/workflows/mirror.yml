name: Propose Lovable updates to Auroraglobal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auroraglobal-lovable-sync
  cancel-in-progress: false

jobs:
  propose-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Lovable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check destination access
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set SYNC_PAT with Contents and Pull requests write access to josephcrown920/Auroraglobal"
            exit 1
          fi
          gh api repos/josephcrown920/Auroraglobal --jq .default_branch

      - name: Propose isolated source snapshot (never overwrite Aurora root)
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "aurora-sync[bot]"
          git config user.email "aurora-sync[bot]@users.noreply.github.com"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/josephcrown920/Auroraglobal.git"
          git fetch destination Main
          snapshot_dir="$(mktemp -d)"
          git archive "$SOURCE_SHA" | tar -x -C "$snapshot_dir"
          git checkout -B lovable-sync destination/Main
          mkdir -p integrations/lovable-studio
          rsync -a --delete --exclude='.git' --exclude='.env*' --exclude='node_modules' --exclude='dist' --exclude='.output' --exclude='.cache' --exclude='*.mp4' --exclude='*.mov' --exclude='*.zip' "$snapshot_dir/" integrations/lovable-studio/
          rm -rf "$snapshot_dir"
          printf '%s\n' "Source: josephcrown920/aurora-performance-studio-f181e112@main" > integrations/lovable-studio/SYNC_SOURCE.txt
          printf '%s\n' "$SOURCE_SHA" > integrations/lovable-studio/SYNC_COMMIT.txt
          git add -A -- integrations/lovable-studio
          if git diff --cached --quiet; then
            echo "No source snapshot differences to propose."
            exit 0
          fi
          git commit -m "chore(sync): stage Lovable source ${SOURCE_SHA}"
          git push destination HEAD:refs/heads/lovable-sync
          if ! gh pr list -R josephcrown920/Auroraglobal --head lovable-sync --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create -R josephcrown920/Auroraglobal --base Main --head lovable-sync \
              --title "Review Lovable source snapshot before integrating into Aurora Global" \
              --body "Isolated source snapshot under integrations/lovable-studio. Does not overwrite Aurora Global production root or deploy Lovable. Review and test before merge."
          fi
